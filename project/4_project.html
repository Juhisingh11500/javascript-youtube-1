<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project 4</title>
    <style>
        body {
            background-color: darkseagreen;
            text-align: center;
            color: rgb(157, 74, 44);
        }

        .form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            font-size: 1.2rem;
        }

        .form input {
            width: 25vh;
            color: rgb(225, 71, 71);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Number Guessing Game</h1>
        <p>Try and guess a random number between 1 to 100</p>
        <p>You have 10 attempts to guess the right number</p>
        <form class="form">
            <label for="guessfield" id="guess">Guess a number</label>
            <input type="text" id="guessfield">
            <input type="submit" value="submit guess" id="subt">
        </form>
        <div class="results">
            <p>Previous guesses <span class="gusses"></span></p>
            <p>Guesses Remaining <span class="lastremaining">10</span></p>
            <p class="loworhi"></p>
        </div>
    </div>
    <script>
        let guessinput = document.querySelector('#guessfield');
        let button = document.querySelector('#subt');
        let resulshow = document.querySelector('.results');
        let pregusses = document.querySelector('.gusses');
        let Remaining = document.querySelector('.lastremaining');
        let dismsg = document.querySelector('.loworhi');
        let para = document.createElement('p');

        let rannum = randomNum();
        let prearr = [];
        let preguess = 0;
        let isActiveGame = true;

        button.addEventListener('click', function (e) {
            e.preventDefault();
            if (!isActiveGame) return;
            let guess = parseInt(guessinput.value);
            validateGuess(guess);
        })

        function randomNum() {
            return parseInt((Math.random() * 100) + 1);
        }

        function validateGuess(guess) {
            if (guess < 1 || guess > 100 || isNaN(guess)) {
                displaymsg(`Please Give a Valid Number`);
                guessinput.value = ''
                return;
            }
            processGuess(guess);
        }

        function processGuess(guess) {
            prearr.push(guess);
            updateUI(guess);
            checkguessres(guess);

            if (preguess === 10 && rannum !== guess) {
                displaymsg(`Game is Over! Correct Number was ${rannum}`);
                gameend();
            }
        }
        function updateUI(guess) {
            guessinput.value = '';
            pregusses.innerHTML += `${guess}  `;
            preguess++;
            Remaining.innerHTML = 10 - preguess;
        }

        function checkguessres(guess) {
            if (rannum === guess) {
                displaymsg(`Congratulation! you won the Game...`);
                gameend();
            } else if (rannum > guess) {
                displaymsg(` you guess the very low number...`);
            } else {
                displaymsg(` you guess the very high number...`);
            }
        }

        function displaymsg(message) {
            dismsg.innerHTML = `<h2>${message}</h2>`
        }

        function gameend() {
            guessinput.setAttribute('disabled', 'true');
            isActiveGame = false;
            para.classList.add('button');
            para.innerHTML = `<h2 id ="newgame">Start new Game</h2>`
            resulshow.appendChild(para);

            startnewGame();
        }

        function startnewGame() {
            para.addEventListener('click', function () {
                rannum = randomNum();
                prearr = [];
                preguess = 0;
                isActiveGame = true;

                 guessinput.value = '';
                  dismsg.innerHTML = '';
                  Remaining.innerHTML = 10 - preguess;
                   pregusses.innerHTML = '';
                    guessinput.removeAttribute('disabled');
                    resulshow.removeChild(para);
            })
        }

    </script>
</body>

</html>
